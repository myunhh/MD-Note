name: MDNote
options:
  developmentLanguage: en
  bundleIdPrefix: com.mdnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  MDNoteCore:
    path: MDNoteCore

schemes:
  MDNote:
    build:
      targets:
        MDNote: all
    test:
      targets:
        - MDNoteArchiveTests

targets:
  MDNoteArchiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ArchiveTests
    dependencies:
      - target: MDNote
      - package: ZIPFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MDNote:
    type: application
    platform: iOS
    sources:
      - path: MDNote/App
      - path: MDNote/Core
      - path: MDNote/Resources/Localization
        buildPhase: resources
      - path: MDNote/Resources/Assets.xcassets
      - path: MDNote/Resources/WebAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: MDNoteCore
      - package: ZIPFoundation
    info:
      path: MDNote/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Expose the app's Documents folder in the Files app ("On My iPad → MD Note")
        # and in Finder file sharing, so .md files + their image folders can be added.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Export compliance: the app uses only Apple-standard crypto (no custom
        # encryption) and is exempt. Declaring NO here stops App Store Connect
        # from asking the encryption question on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Paper stays paper: the document canvas is light-only, so opt the whole
        # app out of dark mode instead of shipping a half-dark UI.
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdnote.app
        PRODUCT_NAME: MD Note
        PRODUCT_MODULE_NAME: MDNote
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
