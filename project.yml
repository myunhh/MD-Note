name: MDNote
options:
  bundleIdPrefix: com.mdnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MDNoteCore:
    path: MDNoteCore

targets:
  MDNote:
    type: application
    platform: iOS
    sources:
      - path: MDNote/App
      - path: MDNote/Core
      - path: MDNote/Resources/Sample.md
        buildPhase: resources
      - path: MDNote/Resources/WebAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: MDNoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdnote.app
        PRODUCT_NAME: MD Note
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
