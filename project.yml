name: MDNote
options:
  bundleIdPrefix: com.mdnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MDNoteCore:
    path: MDNoteCore

targets:
  MDNote:
    type: application
    platform: iOS
    sources:
      - path: MDNote/App
      - path: MDNote/Core
      - path: MDNote/Resources/Sample.md
        buildPhase: resources
      - path: MDNote/Resources/Assets.xcassets
      - path: MDNote/Resources/WebAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: MDNoteCore
    info:
      path: MDNote/Info.plist
      properties:
        # Expose the app's Documents folder in the Files app ("On My iPad → MD Note")
        # and in Finder file sharing, so .md files + their image folders can be added.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Paper stays paper: the document canvas is light-only, so opt the whole
        # app out of dark mode instead of shipping a half-dark UI.
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdnote.app
        PRODUCT_NAME: MD Note
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
